<h1 mat-dialog-title>{{data.title}}</h1>
<div mat-dialog-content class="ai-prompt-content">
    <mat-form-field appearance="outline">
        <mat-label>{{'script.ai-requirement' | translate}}</mat-label>
        <textarea matInput [(ngModel)]="data.prompt" rows="7"
                  (keydown.control.enter)="submit()" [disabled]="working"></textarea>
        <mat-hint>{{'script.ai-submit-hint' | translate}}</mat-hint>
    </mat-form-field>
    <div *ngIf="error" class="ai-error">
        <mat-icon>error_outline</mat-icon>
        <span>{{error}}</span>
    </div>
</div>
<div mat-dialog-actions align="end">
    <button mat-button [mat-dialog-close]="null" [disabled]="working">{{'dlg.cancel' | translate}}</button>
    <button mat-raised-button color="primary" (click)="submit()"
            [disabled]="working || !data.prompt?.trim()">
        <mat-icon>{{working ? 'hourglass_top' : 'auto_awesome'}}</mat-icon>
        {{(working ? 'script.ai-working' : 'script.ai-generate') | translate}}
    </button>
</div>
